# Read the Docs configuration.  RTD has required this file since 2023; without
# it the project cannot rebuild, which is why specdb.readthedocs.io is still
# serving a Sphinx 1.8.6 build of def79be from 2022-05-23.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    post_checkout:
      # setuptools_scm needs the tags to derive a version
      - git fetch --unshallow || true

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

python:
  install:
    # linetools has no release compatible with the 3.11+ floor yet; see Q&A #4
    - method: pip
      path: .
      extra_requirements:
        - docs
